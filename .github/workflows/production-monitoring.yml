name: Production monitoring

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Public availability smoke test
    runs-on: ubuntu-latest
    env:
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
    steps:
      - name: Check production endpoints
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "PRODUCTION_URL is not configured; monitoring is intentionally skipped."
            exit 0
          fi
          curl --fail --silent --show-error --location --max-time 20 --retry 2 --retry-delay 2 "$PRODUCTION_URL/" > /dev/null
          curl --fail --silent --show-error --location --max-time 20 --retry 2 --retry-delay 2 "$PRODUCTION_URL/sitemap.xml" > /dev/null
